<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Five-a-Side Rotation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one sideline screen. Clock up top, mown pitch with bibs in position, bench strip, plan and settings tucked below. */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --ink:#13261B; --muted:#5A6C60; --line:#D2DACE;
  --turf:#1E6A3D; --turf-soft:#DCEBDF; --bib:#EE6A1C; --bib-ink:#FFFFFF; --warn:#B4361F;
  --keeper:#F3C928; --keeper-ink:#2A2205;
  --grass1:#3F8F52; --grass2:#479A5A; --chalk:#F4F8F2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1611; --surface:#15221A; --ink:#E6EEE8; --muted:#93A79A; --line:#27382D;
  --turf:#46A86C; --turf-soft:#1C3324; --bib:#FF8A3D; --bib-ink:#1A0E05; --warn:#FF7A62;
  --keeper:#F5D04A; --keeper-ink:#1E1803; --grass1:#1E4D2C; --grass2:#225532; --chalk:#DCE8DF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1611; --surface:#15221A; --ink:#E6EEE8; --muted:#93A79A; --line:#27382D;
  --turf:#46A86C; --turf-soft:#1C3324; --bib:#FF8A3D; --bib-ink:#1A0E05; --warn:#FF7A62;
  --keeper:#F5D04A; --keeper-ink:#1E1803; --grass1:#1E4D2C; --grass2:#225532; --chalk:#DCE8DF; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--bib);outline-offset:2px}
.hint{color:var(--muted);font-size:.9rem;margin:0}

/* clock */
.clock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.clockrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phase{font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--turf)}
.time{font:700 3.6rem/0.9 var(--display);font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 1rem var(--body);border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--turf);color:#fff}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.next{border-radius:10px;padding:10px 12px;background:var(--turf-soft);display:flex;flex-direction:column;gap:4px}
.next .when{font:700 1.15rem var(--display);text-transform:uppercase;letter-spacing:.04em}
.next .when b{font-variant-numeric:tabular-nums}
.next .chg{font-size:.95rem}
.next .chg b{font-weight:700}
.next .chg span{color:var(--muted);font:700 .8rem var(--display);letter-spacing:.06em;margin-left:4px}

/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:100/118;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass1) 0 12.5%,var(--grass2) 12.5% 25%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pitch svg *{stroke:var(--chalk);stroke-opacity:.7;stroke-width:.6;fill:none}
.pitch svg .dot{fill:var(--chalk);fill-opacity:.7;stroke:none}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px;cursor:pointer;color:inherit}
.tok .pos{font:700 .72rem var(--display);letter-spacing:.12em;color:var(--chalk);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tok .b{position:relative;min-width:76px;padding:9px 12px;border-radius:999px;background:var(--bib);color:var(--bib-ink);font:700 1rem var(--body);box-shadow:0 2px 0 rgba(0,0,0,.28);white-space:nowrap}
.tok.gk .b{background:var(--keeper);color:var(--keeper-ink)}
.tok.empty .b{background:transparent;border:2px dashed var(--chalk);color:var(--chalk);box-shadow:none}
.tok.sel .b{outline:3px solid var(--chalk);outline-offset:3px}
.picking .tok:not(.sel) .b{box-shadow:0 0 0 2px var(--chalk)}
.tag{position:absolute;top:-9px;right:-8px;font:700 .62rem var(--display);letter-spacing:.08em;background:var(--ink);color:var(--surface);padding:2px 5px;border-radius:4px}

/* bench */
.bench{display:flex;flex-direction:column;gap:8px}
.sub{font:700 .8rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;font:700 1rem var(--body);border-radius:999px;padding:10px 14px;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-weight:400;font-size:.78rem;color:var(--muted)}
.chip.sel{outline:3px solid var(--ink);outline-offset:2px}
.picking .chip:not(.sel):not(.absent){border-color:var(--bib)}
.chip.absent{background:transparent;color:var(--muted);border-style:dashed;text-decoration:line-through}
.chip .tag{top:-8px;right:-4px}

/* action bar */
.act{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.act p{margin:0;flex:1 1 180px;font-size:.95rem}
.act button{font:700 .9rem var(--body);padding:9px 12px;border-radius:8px;cursor:pointer;border:1px solid currentColor;background:transparent;color:var(--surface)}
.act .out{background:var(--warn);border-color:var(--warn);color:#fff}

/* collapsibles */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary h2{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0}
summary span{color:var(--muted);font-size:.85rem;text-align:right}
summary::after{content:"+";font:700 1.2rem var(--display);color:var(--muted)}
details[open] summary::after{content:"–"}
.inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
.grid th{font:600 .78rem var(--display);color:var(--muted);letter-spacing:.04em;text-align:center;padding:0}
.grid td.name{white-space:nowrap;padding-right:6px;font-size:.92rem}
.grid td.c{width:28px;height:26px;border-radius:5px;background:var(--bg);text-align:center;font:700 .66rem var(--display);letter-spacing:.04em;color:var(--bib-ink)}
.grid td.c.on{background:var(--bib)}
.grid td.c.gk{background:var(--keeper);color:var(--keeper-ink)}
.grid .split{border-left:2px solid var(--muted)}
.grid .cur{box-shadow:inset 0 0 0 2px var(--ink)}
.grid td.m{text-align:right;font:700 1rem var(--display);padding-left:6px}
.grid tr.absent td.name{color:var(--muted);text-decoration:line-through}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flash{animation:flash 1s ease 3}
@keyframes flash{50%{background:var(--bib);color:var(--bib-ink)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>

<div class="wrap" id="app">
  <section class="clock">
    <div class="clockrow">
      <div><div class="phase" id="phase">Pre-match</div><div class="time" id="time">00:00</div></div>
      <div class="ctrls" id="ctrls"></div>
    </div>
    <div class="next" id="next"></div>
  </section>

  <div class="pitch" id="pitch">
    <svg viewBox="0 0 100 118" aria-hidden="true">
      <rect x="4" y="4" width="92" height="110"/>
      <path d="M38 4 A12 12 0 0 0 62 4"/>
      <circle class="dot" cx="50" cy="4" r="1"/>
      <rect x="24" y="94" width="52" height="20"/>
      <circle class="dot" cx="50" cy="88" r=".9"/>
      <rect x="40" y="114" width="20" height="3"/>
    </svg>
    <div id="toks"></div>
  </div>

  <section class="bench">
    <p class="sub">Bench</p>
    <div class="chips" id="benchNow"></div>
    <div id="absentWrap" hidden><p class="sub" style="margin-top:4px">Not playing</p><div class="chips" id="absentNow"></div></div>
  </section>

  <div class="act" id="act" hidden></div>
  <p class="hint" id="help">Tap two players to swap them. Bench for pitch, or two on the pitch to change positions.</p>

  <details id="planBox">
    <summary><h2>Full rotation</h2><span id="fair"></span></summary>
    <div class="inner">
      <div class="scroll"><table class="grid" id="grid"></table></div>
    </div>
  </details>

  <details id="setBox">
    <summary><h2>Settings</h2><span></span></summary>
    <div class="inner">
      <div class="field">
        <label for="bph">Subs</label>
        <select id="bph">
          <option value="5">Every 5:00 (4 changes a half)</option>
          <option value="4">Every 6:15 (3 changes a half)</option>
          <option value="3">Every 8:20 (2 changes a half)</option>
        </select>
      </div>
      <div class="two">
        <div class="field"><label for="gk0">Keeper, 1st half</label><select id="gk0"></select></div>
        <div class="field"><label for="gk1">Keeper, 2nd half</label><select id="gk1"></select></div>
      </div>
      <p class="hint">"Rotates" means the keeper gets subbed like everyone else. Pick a name to keep one kid in goal for the whole half.</p>
    </div>
  </details>
</div>

<script>
const HALF = 25*60, ON = 5, KEY = 'fas-rotation-v3';
const SQUAD = ['Alex','Ari','Atlas','Carter','Casper','Elliot','Henry','Raph'];
const POS = [ {k:'GK',x:50,y:89}, {k:'LW',x:21,y:42}, {k:'MID',x:50,y:60}, {k:'RW',x:79,y:42}, {k:'ST',x:50,y:20} ];
const FILL = [0,2,4,1,3];   // which empty position a newcomer takes first
let S = load() || fresh();
let sel = null, tickId = null, lastBlock = null, ac = null, wake = null, resetArmed = false;
const _h = {};

function fresh(){ return {present:SQUAD.map(()=>true), gk:[-1,-1], bph:5, plan:null, live:{phase:'pre', el:[0,0], running:false, t0:0}} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.present && s.present.length===SQUAD.length ? s : null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }

const nB = () => S.bph*2, bLen = () => HALF/S.bph;
const fmt = s => { s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0') };
const nm = i => SQUAD[i];
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const started = () => S.live.phase !== 'pre';
const live = () => S.live.phase==='h1' || S.live.phase==='h2';
function setHTML(id,h){ if(_h[id]===h) return; _h[id]=h; document.getElementById(id).innerHTML=h }

function elapsed(){ const L=S.live, h=L.phase==='h2'?1:0; return L.el[h] + (L.running ? (Date.now()-L.t0)/1000 : 0) }
function curBlock(){
  const L=S.live, idx=Math.min(S.bph-1, Math.floor(elapsed()/bLen()));
  return {pre:0, h1:idx, ht:S.bph, h2:S.bph+idx, ft:nB()-1}[L.phase];
}

/* Plan = one array of 5 position slots per shift. Who plays: least minutes first,
   ties to kids who sat out last shift. Where: stay put if you were already on,
   newcomers take the gaps left by whoever came off. */
function replan(from, keepCurrent=false){
  const n=nB(), P=SQUAD.length;
  let plan = (S.plan && S.plan.length===n) ? S.plan.slice(0,from) : [];
  if(plan.length<from){ plan=[]; from=0; keepCurrent=false }
  const cur = keepCurrent && S.plan && S.plan[from] ? S.plan[from] : null;
  const mins = Array(P).fill(0);
  plan.forEach(b=>b.forEach(i=>{ if(i!=null) mins[i]++ }));
  for(let b=from; b<n; b++){
    const half = b<S.bph?0:1, gk = S.gk[half];
    const avail = SQUAD.map((_,i)=>i).filter(i=>S.present[i]);
    const need = Math.min(ON, avail.length), chosen = [];
    if(gk>=0 && S.present[gk]) chosen.push(gk);
    const base = (b===from && cur) ? cur : null;
    if(base) base.forEach(i=>{ if(i!=null && S.present[i] && !chosen.includes(i) && chosen.length<need) chosen.push(i) });
    const prev = b>0 ? (plan[b-1]||[]) : [];
    const rest = avail.filter(i=>!chosen.includes(i))
      .sort((a,c)=> mins[a]-mins[c] || (prev.includes(a)?1:0)-(prev.includes(c)?1:0) || a-c);
    while(chosen.length<need && rest.length) chosen.push(rest.shift());
    const ref = base || prev, slots = Array(ON).fill(null);
    if(gk>=0 && chosen.includes(gk)) slots[0]=gk;
    ref.forEach((i,k)=>{ if(i!=null && chosen.includes(i) && !slots.includes(i) && slots[k]==null) slots[k]=i });
    chosen.filter(i=>!slots.includes(i)).forEach(i=>{ slots[FILL.find(k=>slots[k]==null)] = i });
    plan[b]=slots; slots.forEach(i=>{ if(i!=null) mins[i]++ });
  }
  S.plan=plan; save();
}

function playedSecs(i){
  if(!started()) return 0;
  const cb=curBlock(), L=bLen(); let s=0;
  for(let b=0;b<cb;b++) if(S.plan[b].includes(i)) s+=L;
  if(live() && S.plan[cb].includes(i)) s += elapsed() - (cb%S.bph)*L;
  if(S.live.phase==='ft' && S.plan[cb].includes(i)) s+=L;
  return s;
}

/* ---------- render ---------- */
function render(){
  if(!S.plan || S.plan.length!==nB()) replan(0);
  const L=S.live, e=elapsed(), cb=curBlock(), len=bLen();
  const slots = S.plan[cb], onSet = slots.filter(i=>i!=null);
  const half = cb<S.bph?0:1;

  // clock
  const labels={pre:'Pre-match',h1:'1st half',ht:'Half time',h2:'2nd half',ft:'Full time'};
  document.getElementById('phase').textContent = labels[L.phase] + (live() && !L.running ? ' · paused' : '');
  document.getElementById('time').textContent = L.phase==='ht' ? '25:00' : L.phase==='ft' ? '50:00' : fmt(Math.floor(e) + (L.phase==='h2'?HALF:0) - 0.0001);
  let c='';
  if(L.phase==='pre') c=`<button class="btn" data-a="go">Kick off</button>`;
  else if(live()) c = L.running ? `<button class="btn alt" data-a="pause">Pause</button>` : `<button class="btn" data-a="resume">Resume</button>`;
  else if(L.phase==='ht') c=`<button class="btn" data-a="h2">Start 2nd half</button>`;
  if(started()) c+=`<button class="btn danger" data-a="reset">${resetArmed?'Tap again':'Reset'}</button>`;
  setHTML('ctrls', c);

  // next change
  let nx='', offNext=[], onNext=[];
  if(L.phase==='pre') nx=`<div class="when">Starting five</div><div class="chg">Tap two players to swap before kick-off.</div>`;
  else if(L.phase==='ht') nx=`<div class="when">2nd half lineup</div><div class="chg">Shown on the pitch. Swap anyone before you start.</div>`;
  else if(L.phase==='ft') nx=`<div class="when">Full time</div><div class="chg">Good work, coach.</div>`;
  else {
    const inHalf = cb%S.bph, left = (inHalf+1)*len - e, last = inHalf===S.bph-1;
    if(last) nx=`<div class="when">${half?'Full time':'Half time'} in <b>${fmt(left)}</b></div>`;
    else {
      const nxt=S.plan[cb+1];
      nx=`<div class="when">Next change in <b>${fmt(left)}</b></div>`;
      const rows=[];
      nxt.forEach((i,k)=>{ if(i!=null && !onSet.includes(i)){ const out=slots[k]; onNext.push(i); if(out!=null && !nxt.includes(out)) offNext.push(out);
        rows.push(`<div class="chg"><b>${esc(nm(i))}</b> on for <b>${out!=null && !nxt.includes(out) ? esc(nm(out)) : '—'}</b><span>${POS[k].k}</span></div>`) } });
      onSet.forEach(i=>{ if(!nxt.includes(i) && !offNext.includes(i)) offNext.push(i) });
      nx += rows.join('') || `<div class="chg">No change.</div>`;
    }
  }
  setHTML('next', nx);

  // pitch
  document.getElementById('pitch').classList.toggle('picking', sel!==null);
  setHTML('toks', POS.map((p,k)=>{
    const i=slots[k], isGk=k===0;
    if(i==null) return `<button class="tok empty${isGk?' gk':''}" style="left:${p.x}%;top:${p.y}%" disabled><span class="pos">${p.k}</span><span class="b">Empty</span></button>`;
    const tag = offNext.includes(i) ? '<span class="tag">OFF</span>' : '';
    return `<button class="tok${isGk?' gk':''}${sel===i?' sel':''}" style="left:${p.x}%;top:${p.y}%" data-t="${i}"><span class="pos">${p.k}</span><span class="b">${esc(nm(i))}${tag}</span></button>`;
  }).join(''));

  // bench
  const present = SQUAD.map((_,i)=>i).filter(i=>S.present[i]);
  const bench = present.filter(i=>!onSet.includes(i));
  document.querySelector('.bench').classList.toggle('picking', sel!==null);
  setHTML('benchNow', bench.map(i=>{
    const m = started() ? `<small>${Math.floor(playedSecs(i)/60)}'</small>` : '';
    const tag = onNext.includes(i) ? '<span class="tag">NEXT</span>' : '';
    return `<button class="chip${sel===i?' sel':''}" data-t="${i}">${esc(nm(i))}${m}${tag}</button>`;
  }).join('') || '<span class="hint">Nobody on the bench</span>');
  const absent = SQUAD.map((_,i)=>i).filter(i=>!S.present[i]);
  document.getElementById('absentWrap').hidden = !absent.length;
  setHTML('absentNow', absent.map(i=>`<button class="chip absent" data-t="${i}">${esc(nm(i))}</button>`).join(''));

  // action bar
  const act=document.getElementById('act');
  if(sel===null){ act.hidden=true; setHTML('act','') }
  else {
    act.hidden=false;
    setHTML('act', `<p><b>${esc(nm(sel))}</b> selected. Tap who to swap with.</p><button data-x="cancel">Cancel</button><button class="out" data-x="out">Not playing</button>`);
  }
  document.getElementById('help').hidden = sel!==null || L.phase==='ft';

  renderPlan(cb);
}

function renderPlan(cb){
  const n=nB(), L=bLen();
  let h='<thead><tr><th></th>';
  for(let b=0;b<n;b++) h+=`<th class="${b===S.bph?'split':''}">${b%S.bph===0?(b<S.bph?'1H':'2H'):Math.round((b%S.bph)*L/60)+"'"}</th>`;
  h+='<th>Min</th></tr></thead><tbody>';
  const totals=[];
  SQUAD.forEach((_,i)=>{
    let cnt=0, row='';
    for(let b=0;b<n;b++){
      const k=S.plan[b].indexOf(i);
      if(k>=0) cnt++;
      const lab = k<0 ? '' : (POS[k].k==='MID'?'M':POS[k].k);
      row+=`<td class="c ${k>=0?'on':''} ${k===0?'gk':''} ${b===S.bph?'split':''} ${started()&&b===cb?'cur':''}">${lab}</td>`;
    }
    const mins=Math.round(cnt*L/60);
    if(S.present[i]) totals.push(mins);
    h+=`<tr class="${S.present[i]?'':'absent'}"><td class="name">${esc(nm(i))}</td>${row}<td class="m">${S.present[i]?mins:'–'}</td></tr>`;
  });
  setHTML('grid', h+'</tbody>');
  const lo=Math.min(...totals), hi=Math.max(...totals);
  document.getElementById('fair').textContent = totals.length<=ON ? 'Everyone plays the whole game' : `Everyone plays ${lo===hi?lo:lo+'–'+hi} min`;
}

function renderSettings(){
  const opts='<option value="-1">Rotates</option>'+SQUAD.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  [0,1].forEach(h=>{ const s=document.getElementById('gk'+h); s.innerHTML=opts; s.value=String(S.gk[h]) });
  const b=document.getElementById('bph'); b.value=String(S.bph); b.disabled=started();
}

/* ---------- actions ---------- */
function tapPlayer(i){
  if(S.live.phase==='ft') return;
  if(!S.present[i]){ S.present[i]=true; sel=null; replan(started()?curBlock():0, true); return render() }
  if(sel===null || sel===i){ sel = sel===i ? null : i; return render() }
  const cb=curBlock(), slots=S.plan[cb].slice();
  const a=slots.indexOf(sel), b=slots.indexOf(i);
  if(a<0 && b<0){ sel=i; return render() }           // two bench kids: just move the selection
  if(a>=0 && b>=0){ slots[a]=i; slots[b]=sel }         // two on pitch: swap positions
  else if(a>=0){ slots[a]=i } else { slots[b]=sel }    // bench for pitch
  S.plan[cb]=slots; sel=null;
  replan(cb+1);
  render();
}
function markOut(i){
  S.present[i]=false; sel=null;
  replan(started()?curBlock():0, started());
  render();
}

document.getElementById('app').addEventListener('click', e=>{
  const t=e.target.closest('[data-t]'); if(t) return tapPlayer(+t.dataset.t);
  const x=e.target.closest('[data-x]')?.dataset.x;
  if(x==='cancel'){ sel=null; return render() }
  if(x==='out' && sel!==null) return markOut(sel);
  const a=e.target.closest('[data-a]')?.dataset.a; if(!a) return;
  const L=S.live;
  if(a!=='reset') resetArmed=false;
  if(a==='go'){ beep(); L.phase='h1'; L.el=[0,0]; L.running=true; L.t0=Date.now(); lastBlock=0; holdWake() }
  if(a==='pause'){ L.el[L.phase==='h2'?1:0]=elapsed(); L.running=false; releaseWake() }
  if(a==='resume'){ L.running=true; L.t0=Date.now(); holdWake() }
  if(a==='h2'){ beep(); L.phase='h2'; L.el[1]=0; L.running=true; L.t0=Date.now(); lastBlock=S.bph; holdWake() }
  if(a==='reset'){
    if(!resetArmed){ resetArmed=true; setTimeout(()=>{ resetArmed=false; render() },3000) }
    else { resetArmed=false; sel=null; S.live={phase:'pre',el:[0,0],running:false,t0:0}; S.present=SQUAD.map(()=>true); replan(0); releaseWake(); renderSettings() }
  }
  save(); render();
});
document.getElementById('bph').addEventListener('change', e=>{ S.bph=+e.target.value; S.plan=null; replan(0); render() });
[0,1].forEach(h=>document.getElementById('gk'+h).addEventListener('change', e=>{
  S.gk[h]=+e.target.value; replan(started()?curBlock():0, started()); render();
}));
document.getElementById('planBox').addEventListener('toggle', e=>{ try{ localStorage.setItem(KEY+'-plan', e.target.open?'1':'') }catch(_){} });

/* ---------- clock ---------- */
function tick(){
  const L=S.live;
  if(L.running){
    if(elapsed()>=HALF){
      const h=L.phase==='h2'?1:0;
      L.el[h]=HALF; L.running=false; L.phase=h?'ft':'ht'; sel=null;
      save(); beep(); releaseWake(); renderSettings();
    }
    const cb=curBlock();
    if(lastBlock!==null && cb!==lastBlock && L.running){ beep(); flashNext() }
    lastBlock=cb;
  }
  render();
}
function flashNext(){ const n=document.getElementById('next'); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash') }
function beep(){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.3].forEach(d=>{
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+d;
      o.frequency.value=1100; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.start(t); o.stop(t+0.25);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]) }catch(e){}
}
async function holdWake(){ try{ wake = await navigator.wakeLock.request('screen') }catch(e){} }
function releaseWake(){ try{ wake && wake.release(); wake=null }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.live.running) holdWake() });

try{ if(localStorage.getItem(KEY+'-plan')) document.getElementById('planBox').open=true }catch(e){}
if(S.live.running){ lastBlock=curBlock(); holdWake() }
renderSettings();
render();
tickId = setInterval(tick, 250);
</script>

</body>
